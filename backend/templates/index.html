<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🐺 IWolfU – Shesh Chat</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="loginContainer">
    <h1>🐺 IWolfU Chat</h1>
    <input id="username" placeholder="Enter your nickname..." />

    <div id="chatbox"></div>

  </div>

  <script src="/static/chat.js"></script>
</body>
</html>
